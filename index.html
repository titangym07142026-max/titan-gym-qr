<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TITAN GYM Member QR</title>

<style>
body{
  margin:0;
  padding:20px;
  background:#f3f4f6;
  font-family:Arial, sans-serif;
}

.card{
  max-width:420px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:900;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  font-size:18px;
  font-weight:bold;
  margin-bottom:20px;
}

.details{
  background:#f9fafb;
  border-radius:15px;
  padding:15px;
}

.row{
  padding:10px 0;
  border-bottom:1px solid #ddd;
}

.row:last-child{
  border-bottom:none;
}

.label{
  font-weight:bold;
}

.status{
  font-weight:bold;
}
</style>

</head>

<body>

<div class="card">

<div class="logo">
TITAN GYM
</div>

<div class="subtitle">
Member Details
</div>

<div class="details">

<div class="row">
<span class="label">Name:</span>
<span id="name">-</span>
</div>

<div class="row">
<span class="label">Member ID:</span>
<span id="id">-</span>
</div>

<div class="row">
<span class="label">Membership:</span>
<span id="membership">-</span>
</div>

<div class="row">
<span class="label">Due Date:</span>
<span id="due">-</span>
</div>

<div class="row">
<span class="label">Status:</span>
<span id="status" class="status">-</span>
</div>

<div class="row">
<span class="label">Days Remaining:</span>
<span id="days">-</span>
</div>

</div>

</div>


<script>

const params = new URLSearchParams(window.location.search);

document.getElementById("name").textContent =
params.get("name") || "-";

document.getElementById("id").textContent =
params.get("id") || "-";

document.getElementById("membership").textContent =
params.get("membership") || "-";

document.getElementById("due").textContent =
params.get("due") || "-";

document.getElementById("status").textContent =
params.get("status") || "-";

document.getElementById("days").textContent =
params.get("days") || "-";

</script>

</body>
</html>
