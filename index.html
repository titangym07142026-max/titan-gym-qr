<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Titan Gym — Member QR</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f5f7fa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(440px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:28px;box-shadow:0 16px 50px rgba(15,23,42,.12);text-align:center}
.logo{font-weight:900;letter-spacing:.12em;font-size:14px;color:#111827}.sub{color:#667085;font-size:14px;margin-top:6px}
h1{font-size:25px;margin:18px 0 4px}.name{font-size:20px;font-weight:800}.id{color:#667085;margin-top:4px}
.qrwrap{margin:24px auto 18px;width:250px;height:250px;display:grid;place-items:center;background:#fff;border-radius:18px}
#qrcode{width:230px;height:230px}.status{display:inline-block;padding:7px 12px;border-radius:999px;background:#eef2ff;color:#3730a3;font-weight:800;font-size:12px;margin-bottom:12px}
button{border:0;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:800;cursor:pointer;width:100%;margin-top:9px}
.primary{background:#111827;color:#fff}.secondary{background:#eef2f7;color:#111827}.error{color:#b42318;background:#fef3f2;border:1px solid #fecdca;border-radius:12px;padding:14px;text-align:left}
.small{font-size:12px;color:#98a2b3;margin-top:16px;line-height:1.5}.hidden{display:none}
</style>
</head>
<body>
<main class="card">
  <div class="logo">TITAN GYM</div>
  <div class="sub">Membership QR Code</div>
  <section id="content" class="hidden">
    <h1>Member QR</h1>
    <div id="name" class="name"></div>
    <div id="id" class="id"></div>
    <div id="status" class="status"></div>
    <div class="qrwrap"><div id="qrcode"></div></div>
    <button class="primary" id="download">Download My QR</button>
    <button class="secondary" id="share">Share QR Link</button>
    <div class="small">Keep this QR code for your Titan Gym visits. Save it to your phone for quick access.</div>
  </section>
  <section id="error" class="error hidden"></section>
</main>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const encoded=params.get('data');
  const content=document.getElementById('content'), error=document.getElementById('error');
  let data, qrPayload;
  function decode(s){
    s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4)s+='=';
    return decodeURIComponent(escape(atob(s)));
  }
  function fail(msg){error.textContent=msg;error.classList.remove('hidden')}
  if(!encoded){fail('This QR download link is incomplete. Please ask Titan Gym staff to send you a new QR link.');return}
  try{data=JSON.parse(decode(encoded));qrPayload=data.payload;if(!qrPayload)throw new Error('Missing QR payload');}
  catch(e){fail('This QR download link is invalid or expired. Please ask Titan Gym staff for a new link.');return}
  document.getElementById('name').textContent=data.name||'Titan Gym Member';
  document.getElementById('id').textContent=data.id?'Member ID: '+data.id:'';
  document.getElementById('status').textContent=data.status||'MEMBER';
  try{
    new QRCode(document.getElementById('qrcode'),{text:qrPayload,width:230,height:230,colorDark:'#111827',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
  }catch(e){fail('Unable to generate the QR code. Please reload the page.');return}
  content.classList.remove('hidden');
  function qrCanvas(){return document.querySelector('#qrcode canvas')}
  document.getElementById('download').onclick=function(){
    const c=qrCanvas(); if(!c){alert('QR is still loading. Please try again.');return}
    const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='Titan-Gym-QR-'+(data.id||'Member')+'.png';a.click();
  };
  document.getElementById('share').onclick=async function(){
    try{if(navigator.share)await navigator.share({title:'Titan Gym Membership QR',text:'My Titan Gym membership QR code',url:location.href});else{await navigator.clipboard.writeText(location.href);alert('QR link copied. You can paste it into Messenger.')}}catch(e){if(e.name!=='AbortError')alert('Could not share the link.');}
  };
})();
</script>
</body>
</html>
