const SUPABASE_URL='https://wsjkrzctojzpltmrmzqu.supabase.co';
const SUPABASE_KEY='sb_publishable_Q5tfGMMCFkPvKghKyUiDpw_eb5KJOOr';
function dateObj(v){if(!v)return null;if(/^\d{4}-\d{2}-\d{2}$/.test(v))return new Date(v+'T23:59:59');let m=v.match(/^(\d{1,2})\/(\d{1,2})$/);if(m)return new Date(2026,+m[1]-1,+m[2],23,59,59);return null}
function statusOf(m){let d=dateObj(m.due);if(!d)return 'ENDED';return d>=new Date(new Date().setHours(0,0,0,0))?'ACTIVE':'ENDED'}
function daysLeft(m){let d=dateObj(m.due);if(!d)return null;let t=new Date();t.setHours(0,0,0,0);return Math.ceil((d-t)/86400000)}
function renewed(m){return !!m.renewed || /\brenewed\b/i.test(m.notes||'')}
function promo(m){return !!m.promo3m || /3\s*months?\s*promo/i.test(m.notes||'')}
function qrPayloadFor(m){const st=statusOf(m),n=daysLeft(m),near=st==='ACTIVE'&&n!==null&&n<=7;return `TITAN GYM\nMember ID: ${m.id}\nName: ${m.name}\nMembership: ${m.membershipType}\nDue Date: ${m.due}\nStatus: ${st}${n!==null?'\nDays Remaining: '+n:''}${near?'\nEXPIRING SOON':''}${renewed(m)?'\nRenewed: YES':''}${promo(m)?'\n3-Month Promo: YES':''}`}
function render(m,source){const c=document.getElementById('content');c.innerHTML=`<div class="info"><div><b>${esc(m.name)}</b></div><div>Member ID: <b>${esc(m.id)}</b></div><div>Status: <b>${esc(statusOf(m))}</b></div></div><div id="qr" class="qr"></div><div class="btns"><button class="btn primary" onclick="downloadQR()">Download QR</button><button class="btn secondary" onclick="sharePage()">Share Link</button></div><div class="muted">This is the member's Titan Gym membership QR code.</div>`;new QRCode(document.getElementById('qr'),{text:qrPayloadFor(m),width:260,height:260,colorDark:'#111827',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});window.currentMember=m;}
function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function downloadQR(){const img=document.querySelector('#qr img');const canvas=document.querySelector('#qr canvas');const a=document.createElement('a');a.download='Titan-Gym-QR-'+window.currentMember.id+'.png';a.href=img?img.src:canvas.toDataURL('image/png');a.click()}
async function sharePage(){try{if(navigator.share)await navigator.share({title:'Titan Gym Membership QR',text:window.currentMember.name,url:location.href});else{await navigator.clipboard.writeText(location.href);alert('QR page link copied.')}}catch(e){}}
async function getMember(id){const local=EMBEDDED_MEMBERS.find(x=>x.id===id);try{const u=SUPABASE_URL+'/rest/v1/members?select=id,name,membership_type,due,member_status,renewed,promo_3m,notes&gym_id=eq.TITAN-GYM&id=eq.'+encodeURIComponent(id);const r=await fetch(u,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});if(r.ok){const rows=await r.json();if(rows[0])return {id:rows[0].id,name:rows[0].name,membershipType:rows[0].membership_type||'Regular',due:rows[0].due||'',renewed:!!rows[0].renewed,promo3m:!!rows[0].promo_3m,notes:rows[0].notes||''}}}catch(e){}return local}
(async()=>{const id=new URLSearchParams(location.search).get('id');const c=document.getElementById('content');if(!id){c.innerHTML='<div class="error">This QR link is incomplete.<br><br>Please scan the <b>Scan to Open Member QR Page</b> QR from the Titan Gym POS, or open the complete member link containing <b>?id=TITAN-xxxx</b>.</div>';return}if(typeof QRCode==='undefined'){c.innerHTML='<div class="error">QR generator could not load. Please check your internet connection and try again.</div>';return}const m=await getMember(id);if(!m){c.innerHTML='<div class="error">Member not found.<br><br>Please ask Titan Gym staff to generate a new QR link.</div>';return}render(m)})();
